  capstone: false
  section_quiz: true
  modules:
  - id: module-01
    title: Rolling Replacement And Recovery
    objectives:
    - Identify Deployment template changes and revisions.
    - Calculate rolling-update limits.
    - Explain health and capacity effects on progress.
    - Evaluate rollback compatibility and external state.
    outline:
    - Rolling Updates And Health Gates
    - Calculating Rollout Capacity And Diagnosing Progress
