  title: Use ConfigMaps and Secrets to configure applications
  curriculum_item: Use ConfigMaps and Secrets to configure applications
  capstone: false
  section_quiz: true
  modules:
  - id: module-01
    title: Configuration And Confidential Input Delivery
    objectives:
    - Choose file or environment delivery for configuration.
    - Explain namespace and key references.
    - Distinguish input updates from application reload.
    - Evaluate confidentiality, indirect access and rotation.
    outline:
