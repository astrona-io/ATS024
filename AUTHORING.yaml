- id: section-040
  title: Understand the primitives used to create robust, self-healing, application deployments
  curriculum_item: Understand the primitives used to create robust, self-healing, application deployments
  capstone: false
  section_quiz: true
  modules:
  - id: module-01
    title: Reconciliation And Application Health
    objectives:
    - Explain owner-driven replacement and desired state.
    - Distinguish process startup from useful service.
    - Choose health checks with appropriate recovery actions.
    - Identify dependencies that replacement cannot repair.
    outline:
    - Desired State And Reconciliation
    - Designing Startup, Readiness And Liveness Checks
    playground: false
    module_lab: false
    sources:
