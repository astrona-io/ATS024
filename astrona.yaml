# Reading-only course. YAML assessments are registered separately in assessments/index.yaml.
training:
  id: ATS024
  title: 'CKA: Workloads & Scheduling'
  description: Detailed reading lessons and reusable YAML knowledge checks covering the CKA domain. No
    new labs or playgrounds. Technical content remains draft for review.
  certification:
    name: Certified Kubernetes Administrator
    code: CKA
    provider: CNCF / Linux Foundation
    domain: Workloads & Scheduling
    weight: 15
    competencies:
    - Understand application deployments and how to perform rolling update and rollbacks
    - Use ConfigMaps and Secrets to configure applications
    - Configure workload autoscaling
    - Understand the primitives used to create robust, self-healing, application deployments
    - Configure Pod admission and scheduling (limits, node affinity, etc.)
