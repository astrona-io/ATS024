  id: section-030
  title: Configure workload autoscaling
placement:
  position: after
  reading: sections/section-030/module-01/course-03-summary.md
questions:
- id: ats024-section-030-q01
  type: single_choice
  difficulty: beginner
  learning_objective: Identify autoscaling target and metric requirements.
  source_readings:
  - sections/section-030/module-01/course-01-metric-driven-replica-decisions-and-their-boundaries.md
  prompt: What does an HPA directly adjust for a supported workload?
  options:
  - id: a
    text: The cluster's node count in every installation
    explanation: Infrastructure scaling is a separate responsibility.
  - id: b
    text: Every container's memory limit
    explanation: HPA does not universally rewrite resource limits.
  - id: c
    text: The desired replica count
    explanation: Horizontal scaling changes workload replica intent.
  correct_option: c
  explanation: Horizontal scaling changes workload replica intent.
- id: ats024-section-030-q02
  type: single_choice
  difficulty: beginner
  learning_objective: Interpret utilization relative to requests.
  source_readings:
  - sections/section-030/module-01/course-01-metric-driven-replica-decisions-and-their-boundaries.md
  prompt: A CPU utilization target needs which denominator under its applicable calculation?
  options:
  - id: a
    text: The number of ConfigMap keys
    explanation: Input count does not define CPU allocation.
  - id: b
    text: The relevant CPU requests
    explanation: Utilization is interpreted relative to declared requests under that metric target.
  - id: c
    text: The length of the Service name
    explanation: Naming is unrelated to resource utilization.
  correct_option: b
  explanation: Utilization is interpreted relative to declared requests under that metric target.
- id: ats024-section-030-q03
  type: single_choice
  difficulty: beginner
  learning_objective: Interpret utilization relative to requests.
  source_readings:
  - sections/section-030/module-01/course-01-metric-driven-replica-decisions-and-their-boundaries.md
  prompt: Ignoring other controls, two replicas at 100% utilization against a 50% target suggest how many
    replicas?
  options:
  - id: a
    text: Four
    explanation: The simplified ratio doubles the current count before applicable bounds and behavior.
  - id: b
    text: One
    explanation: That reverses the direction of the utilization ratio.
  - id: c
    text: Exactly fifty
    explanation: The percentage target is not itself the desired replica number.
  correct_option: a
  explanation: The simplified ratio doubles the current count before applicable bounds and behavior.
- id: ats024-section-030-q04
  type: single_choice
  difficulty: beginner
  learning_objective: Explain stabilization and minimum or maximum bounds.
  source_readings:
  - sections/section-030/module-01/course-01-metric-driven-replica-decisions-and-their-boundaries.md
  prompt: Why can observed scaling differ from the simplified ratio immediately?
  options:
  - id: a
    text: The HPA always ignores metrics
    explanation: Its purpose depends on the configured metric contract.
  - id: b
    text: Every workload is forced to keep exactly two replicas
    explanation: Minimum and maximum settings can vary.
  - id: c
    text: Bounds, stabilization, tolerance and metric conditions affect the controller
    explanation: The simple calculation is not an instantaneous universal promise.
  correct_option: c
  explanation: The simple calculation is not an instantaneous universal promise.
- id: ats024-section-030-q05
  type: single_choice
  difficulty: beginner
  learning_objective: Distinguish replica scaling from node capacity and bottleneck recovery.
  source_readings:
  - sections/section-030/module-01/course-01-metric-driven-replica-decisions-and-their-boundaries.md
  prompt: An HPA asks for more replicas, but the new Pods remain Pending. What is a distinct issue?
  options:
  - id: a
    text: A guaranteed ConfigMap encoding problem
    explanation: Pending needs relevant scheduling and preparation evidence.
  - id: b
    text: Placement capacity and workload constraints
    explanation: Replica intent does not guarantee runnable infrastructure.
  - id: c
    text: A guarantee that the metric calculation was impossible
    explanation: The desired scale can be valid while placement fails.
  correct_option: b
  explanation: Replica intent does not guarantee runnable infrastructure.
