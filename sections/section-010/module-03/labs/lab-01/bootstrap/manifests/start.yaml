---
apiVersion: v1
kind: Service
metadata:
  name: crew
  namespace: starfleet
spec:
  clusterIP: None
  selector:
    app: crew
  ports:
  - name: none
    port: 80
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: crew
  namespace: starfleet
spec:
  serviceName: crew
  replicas: 4
  selector:
    matchLabels:
      app: crew
  template:
    metadata:
      labels:
        app: crew
    spec:
      containers:
      - name: crew
        image: docker.io/library/busybox:1.36.1
        command:
        - sh
        - -c
        - sleep 3600
