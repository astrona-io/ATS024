# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Resource Quotas And Limit Ranges (PLAYGROUND): ungraded environment. It starts the example workloads and stays running.
apiVersion: astrona.io/v1
metadata:
  name: ats-024-playground-050-07
  docs:
    guide: docs/overview.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
      - docker.io/library/busybox:1.37.0
      - docker.io/library/python:3.13-alpine
    nodes:
      workers: 1
bootstrap:
  manifests:
    - name: starfleet
      type: file
      source: manifests/starfleet.yaml
  waitFor:
    - resource: deploy/scout
      namespace: starfleet
    - resource: deploy/probe
      namespace: starfleet
    - resource: deploy/shuttle
      namespace: starfleet
    - resource: deploy/drifter
      namespace: outpost
teardown:
  keepCluster: false
