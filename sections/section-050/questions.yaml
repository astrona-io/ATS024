id: ats024-section-050
course_id: ATS024
exam_code: CKA
status: draft
provenance: Original practice material; not official examination questions.
scope:
  type: section
  id: section-050
  title: Configure Pod admission and scheduling (limits, node affinity, etc.)
placement:
  position: after
  reading: sections/section-050/module-02/course-03-summary.md
questions:
- id: ats024-section-050-q01
  type: single_choice
  difficulty: beginner
  learning_objective: Compare required and preferred affinity.
  source_readings:
  - sections/section-050/module-01/course-01-filtering-scoring-and-placement-rules.md
  prompt: A required affinity rule excludes all otherwise capacious nodes. What can result?
  options:
  - id: a
    text: The scheduler must ignore required rules for convenience
    explanation: Required placement is part of the declared contract.
  - id: b
    text: The Service automatically moves the Pod
    explanation: Routing objects do not place workloads.
  - id: c
    text: No eligible placement despite apparent capacity elsewhere
    explanation: Required rules filter feasibility.
  correct_option: c
  explanation: Required rules filter feasibility.
- id: ats024-section-050-q02
  type: single_choice
  difficulty: beginner
  learning_objective: Compare required and preferred affinity.
  source_readings:
  - sections/section-050/module-01/course-01-filtering-scoring-and-placement-rules.md
  prompt: How does preferred affinity differ from a required rule?
  options:
  - id: a
    text: It disables resource requests
    explanation: Preference and allocation constraints are separate.
  - id: b
    text: It influences preference among otherwise feasible choices
    explanation: Preference does not impose the same hard exclusion.
  - id: c
    text: It guarantees that one named node must always be used
    explanation: Preferred selection does not supply that guarantee.
  correct_option: b
  explanation: Preference does not impose the same hard exclusion.
- id: ats024-section-050-q03
  type: single_choice
  difficulty: beginner
  learning_objective: Interpret taints and tolerations.
  source_readings:
  - sections/section-050/module-01/course-01-filtering-scoring-and-placement-rules.md
  prompt: A Pod tolerates a node's taint. What does that establish?
  options:
  - id: a
    text: The taint need not exclude it under the relevant effect
    explanation: A toleration allows consideration rather than forcing placement or health.
  - id: b
    text: It must be scheduled there immediately
    explanation: Other filters and choices still apply.
  - id: c
    text: The node's failing condition is repaired
    explanation: Toleration does not fix the host.
  correct_option: a
  explanation: A toleration allows consideration rather than forcing placement or health.
- id: ats024-section-050-q04
  type: single_choice
  difficulty: beginner
  learning_objective: Distinguish policy rejection from scheduler placement.
  source_readings:
  - sections/section-050/module-02/course-02-applying-pod-security-requirements-at-admission.md
  prompt: An enforced admission profile rejects a workload. Is this a scheduler decision for an accepted
    Pod?
  options:
  - id: a
    text: Yes; every rejection comes from the scheduler
    explanation: Admission has independent policy decisions.
  - id: b
    text: Yes; changing a Service selector bypasses that policy
    explanation: Routing selection does not override admission requirements.
  - id: c
    text: No; admission and placement are separate stages
    explanation: A rejected definition has not progressed to ordinary placement.
  correct_option: c
  explanation: A rejected definition has not progressed to ordinary placement.
- id: ats024-section-050-q05
  type: single_choice
  difficulty: beginner
  learning_objective: Evaluate complete container resource needs.
  source_readings:
  - sections/section-050/module-02/course-01-expressing-resource-needs-for-every-container.md
  prompt: Why inspect effective defaults and all workload containers?
  options:
  - id: a
    text: Admission always deletes every configured limit
    explanation: That is not the universal defaulting behavior.
  - id: b
    text: They determine the resource contract used after admission
    explanation: Omitted source settings and the main container alone can be incomplete.
  - id: c
    text: Helpers do not affect any capacity need
    explanation: Supporting processes still consume resources.
  correct_option: b
  explanation: Omitted source settings and the main container alone can be incomplete.
