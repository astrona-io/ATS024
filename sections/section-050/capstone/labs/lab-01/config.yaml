apiVersion: astrona.io/v1
metadata:
  name: ats-024-lab-050-cap
  docs:
    prerequisites: docs/prerequisites.md
    examQuestion: question.md
    caseStudy: docs/case-study.md
    guide: solution.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/busybox:1.37.0
    nodes:
      workers: 2
bootstrap:
  init:
  - name: seed-private-environment
    type: file
    source: bootstrap/setup.sh
teardown:
  keepCluster: false
testing:
  init:
  - name: reference-result
    type: file
    source: solution/apply.sh
validation:
  scripts:
  - name: namespace-enforces-restricted
    description: starfleet enforces the restricted Pod Security level
    type: file
    source: validation/validate-namespace-restricted.sh
    hint: Label the namespace pod-security.kubernetes.io/enforce=restricted.
  - name: dedicated-nodes-intact
    description: Both workers keep their label and taint and accept new Pods
    type: file
    source: validation/validate-dedicated-nodes.sh
    hint: Uncordon the cordoned worker. Do not remove the taint or the labels.
  - name: scout-eligible-and-attracted
    description: scout tolerates the taint and requires the dedicated pool
    type: file
    source: validation/validate-scout-placement.sh
    hint: Add a toleration for dedicated=scout:NoSchedule and required node affinity for pool In [dedicated].
  - name: scout-requests-and-spread
    description: scout has realistic requests and a zone spread constraint
    type: file
    source: validation/validate-scout-requests-spread.sh
    hint: Set CPU and memory requests (CPU at most 250m) and a topologySpreadConstraints entry with maxSkew 1 on the zone label.
  - name: scout-running-and-restricted
    description: Four scout Pods run, spread two and two, and meet restricted
    type: file
    source: validation/validate-scout-running.sh
    hint: Add the four restricted settings and a numeric runAsUser to the Pod template, then wait for the rollout.
