# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Workload Controllers For Self-Healing (PLAYGROUND). A clean, ungraded
# sandbox with a Deployment, a DaemonSet, a StatefulSet, a Job and a CronJob.
apiVersion: astrona.io/v1
metadata:
  name: ats-024-playground-040-02
  docs:
    guide: docs/overview.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/busybox:1.37.0
    nodes:
      workers: 1
bootstrap:
  manifests:
  - name: starfleet
    type: file
    source: manifests/starfleet.yaml
  - name: controllers
    type: file
    source: manifests/controllers.yaml
  - name: batch
    type: file
    source: manifests/batch.yaml
  waitFor:
  - resource: deploy/scout
    namespace: starfleet
teardown:
  keepCluster: false
