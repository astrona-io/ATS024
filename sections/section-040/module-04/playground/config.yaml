# Voluntary And Involuntary Disruption (PLAYGROUND): ungraded sandbox with one
# control-plane node and one worker node. No task, no grading.
apiVersion: astrona.io/v1
metadata:
  name: ats-024-playground-040-04
  docs:
    guide: docs/overview.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/busybox:1.37.0
    nodes:
      workers: 1
bootstrap:
  manifests:
  - name: starfleet
    type: file
    source: manifests/starfleet.yaml
  waitFor:
  - resource: deploy/scout
    namespace: starfleet
  - resource: deploy/probe
    namespace: starfleet
  - resource: deploy/drifter
    namespace: outpost
teardown:
  keepCluster: false
