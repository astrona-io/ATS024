apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scout
  namespace: starfleet
spec:
  replicas: 3
  selector:
    matchLabels:
      app: scout
  template:
    metadata:
      labels:
        app: scout
    spec:
      containers:
      - name: scout
        image: docker.io/library/busybox:1.37.0
        command:
        - sh
        - -c
        - mkdir -p /www && echo scout-v1 > /www/index.html && exec httpd -f -p 8080 -h /www
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /
            port: 9090
          periodSeconds: 2
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: scout
  namespace: starfleet
spec:
  minAvailable: 3
  selector:
    matchLabels:
      app: scout
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bridge
  namespace: starfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bridge
  template:
    metadata:
      labels:
        app: bridge
    spec:
      containers:
      - name: bridge
        image: docker.io/library/busybox:1.37.0
        command:
        - sh
        - -c
        - test -f /work/config.ready || { echo "config.ready is missing" >&2; exit 1; }; echo bridge-running; exec sleep 3600
        volumeMounts:
        - name: work
          mountPath: /work
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
      volumes:
      - name: work
        emptyDir: {}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: sweep
  namespace: starfleet
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Allow
  successfulJobsHistoryLimit: 20
  failedJobsHistoryLimit: 20
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: sweep
            image: docker.io/library/busybox:1.37.0
            command: ["sh", "-c", "echo sweep-complete"]
