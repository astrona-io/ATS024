# probe: log-shipper is a native sidecar (an init container with restartPolicy
# Always). It starts first, keeps running, and stops after the main container.
apiVersion: v1
kind: Pod
metadata:
  name: probe
  namespace: starfleet
spec:
  initContainers:
    - name: log-shipper
      image: docker.io/library/busybox:1.37.0
      restartPolicy: Always
      command: ["sh", "-c", "touch /logs/app.log; tail -F /logs/app.log"]
      startupProbe:
        exec:
          command: ["test", "-f", "/logs/app.log"]
        periodSeconds: 2
        failureThreshold: 15
      volumeMounts:
        - name: logs
          mountPath: /logs
  containers:
    - name: probe
      image: docker.io/library/busybox:1.37.0
      command: ["sh", "-c", "while true; do date >> /logs/app.log; sleep 5; done"]
      volumeMounts:
        - name: logs
          mountPath: /logs
  volumes:
    - name: logs
      emptyDir: {}
