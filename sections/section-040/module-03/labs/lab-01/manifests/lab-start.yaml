apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
---
apiVersion: v1
kind: Namespace
metadata:
  name: outpost
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bridge
  namespace: starfleet
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bridge
  template:
    metadata:
      labels:
        app: bridge
    spec:
      containers:
        - name: bridge
          image: docker.io/library/busybox:1.37.0
          command:
            - sh
            - -c
            - |
              test -f /work/config.txt || { echo "missing /work/config.txt" >&2; exit 1; }
              echo "bridge ready: $(cat /work/config.txt)"
              while true; do sleep 5; done
          volumeMounts:
            - name: work
              mountPath: /work
      volumes:
        - name: work
          emptyDir: {}
---
apiVersion: v1
kind: Pod
metadata:
  name: drifter-survey
  namespace: outpost
spec:
  restartPolicy: Always
  containers:
    - name: survey
      image: docker.io/library/busybox:1.37.0
      command: ["sh", "-c", "echo survey-complete"]
