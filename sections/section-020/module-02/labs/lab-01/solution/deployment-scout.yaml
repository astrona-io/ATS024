apiVersion: apps/v1
kind: Deployment
metadata:
  name: scout
  namespace: starfleet
spec:
  replicas: 2
  selector:
    matchLabels:
      app: scout
  template:
    metadata:
      labels:
        app: scout
    spec:
      containers:
      - name: scout
        image: docker.io/library/busybox:1.37.0
        command:
        - sh
        - -c
        - sleep 3600
        env:
        - name: APP_MODE
          valueFrom:
            configMapKeyRef:
              name: scout-settings
              key: mode
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: scout-db
              key: password
        envFrom:
        - configMapRef:
            name: scout-settings
          prefix: SCOUT_
