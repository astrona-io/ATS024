# Create ConfigMaps And Secrets And Inject Environment Variables (PLAYGROUND).
# Ungraded sandbox: starts the Starfleet namespaces and a client Pod, then stays running.
apiVersion: astrona.io/v1
metadata:
  name: ats-024-playground-020-02
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
      - docker.io/library/busybox:1.37.0

bootstrap:
  manifests:
    - name: starfleet
      type: file
      source: manifests/starfleet.yaml
  waitFor:
    - resource: deploy/shuttle
      namespace: starfleet
    - resource: deploy/drifter
      namespace: outpost

teardown:
  keepCluster: false
